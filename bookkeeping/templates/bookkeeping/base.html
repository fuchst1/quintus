{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bookkeeping{% endblock %} | Quintus Buchhaltung</title>
    <link rel="stylesheet" href="{% static 'bookkeeping/css/styles.css' %}">
    <script src="{% static 'bookkeeping/js/app.js' %}" defer></script>
</head>
<body>
    <div class="bookkeeping-shell">
        {% include 'bookkeeping/partials/navigation.html' %}
        <main class="bookkeeping-main">
            {% if messages %}
                <div class="messages" aria-live="polite">
                    {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
