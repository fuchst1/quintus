{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quintus Buchhaltung{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'bookkeeping/css/bookkeeping.css' %}">
</head>
<body class="bookkeeping-body">
    <div class="bookkeeping-shell">
        <aside class="bookkeeping-sidebar" aria-label="Bookkeeping-Navigation">
            <a href="{% url 'bookkeeping_overview' %}" class="bookkeeping-brand text-decoration-none">
                <img src="{% static 'webapp/img/logo03.png' %}" alt="Firmenlogo Quintus" class="bookkeeping-brand-logo">
                <span class="bookkeeping-brand-title">QUINTUS</span>
                <span class="bookkeeping-brand-subtitle">BUCHHALTUNG</span>
            </a>
            <hr class="bookkeeping-sidebar-divider">
            <nav class="bookkeeping-nav" aria-label="Bookkeeping-Bereiche">
                <a href="{% url 'bookkeeping_overview' %}" class="bookkeeping-nav-link {% if show_dashboard %}bookkeeping-nav-link-active{% endif %}" data-bookkeeping-nav-link="dashboard" data-server-active="{% if show_dashboard %}true{% else %}false{% endif %}">
                    <i class="bi bi-grid-1x2" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{% url 'bookkeeping_overview' %}?status=bank_import#bank-import" class="bookkeeping-nav-link bookkeeping-nav-link-bank-import {% if selected_status == 'bank_import' %}bookkeeping-nav-link-active{% endif %}" data-bookkeeping-nav-link="bank-import" data-server-active="{% if selected_status == 'bank_import' %}true{% else %}false{% endif %}">
                    <i class="bi bi-upload" aria-hidden="true"></i>
                    <span>Bankimport</span>
                </a>
                {% for item in status_navigation %}
                <a href="{{ item.url }}" class="bookkeeping-nav-link {% if item.active %}bookkeeping-nav-link-active{% endif %}" data-bookkeeping-nav-link="{{ item.value }}" data-server-active="{{ item.active|yesno:'true,false' }}">
                    <i class="bi {{ item.icon }}" aria-hidden="true"></i>
                    <span>{{ item.label }}</span>
                    <span class="badge bookkeeping-nav-count" aria-label="{{ item.count }} Transaktionen">{{ item.count }}</span>
                </a>
                {% endfor %}
                <a href="{% url 'matching_rule_list' %}" class="bookkeeping-nav-link {% if request.resolver_match.url_name == 'matching_rule_list' or request.resolver_match.url_name == 'matching_rule_detail' or request.resolver_match.url_name == 'matching_rule_edit' or request.resolver_match.url_name == 'matching_rule_version' or request.resolver_match.url_name == 'matching_rule_delete' %}bookkeeping-nav-link-active{% endif %}" data-bookkeeping-nav-link="matching-rules" data-server-active="{% if request.resolver_match.url_name == 'matching_rule_list' or request.resolver_match.url_name == 'matching_rule_detail' or request.resolver_match.url_name == 'matching_rule_edit' or request.resolver_match.url_name == 'matching_rule_version' or request.resolver_match.url_name == 'matching_rule_delete' %}true{% else %}false{% endif %}">
                    <i class="bi bi-sliders" aria-hidden="true"></i>
                    <span>Matching-Regeln</span>
                </a>
            </nav>
        </aside>
        <div class="bookkeeping-page">
            <header class="bookkeeping-header">
                <h1 class="bookkeeping-header-title">QUINTUS BUCHHALTUNG</h1>
            </header>
            <main class="bookkeeping-main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script>
        (() => {
            const links = document.querySelectorAll("[data-bookkeeping-nav-link]");
            const updateActiveLink = () => {
                const bankImportSelected = window.location.hash === "#bank-import";
                links.forEach((link) => {
                    link.classList.toggle(
                        "bookkeeping-nav-link-active",
                        bankImportSelected
                            ? link.dataset.bookkeepingNavLink === "bank-import"
                            : link.dataset.serverActive === "true",
                    );
                });
            };
            updateActiveLink();
            window.addEventListener("hashchange", updateActiveLink);
        })();
    </script>
</body>
</html>
