<div class="core-ledger-field">
    <label class="core-ledger-label" for="modal-partner">Geschäftspartner</label>
    <input class="core-ledger-control"
           id="modal-partner"
           name="partner"
           type="text"
           value="Hausbetreuung Donau GmbH"
           autocomplete="organization">
</div>
<div class="core-ledger-field">
    <label class="core-ledger-label" for="modal-betrag">
        Bruttobetrag <span class="core-ledger-required" aria-hidden="true">*</span>
        <span class="visually-hidden">(Pflichtfeld)</span>
    </label>
    <div class="input-group">
        <input class="core-ledger-control core-ledger-numeric"
               id="modal-betrag"
               name="amount"
               type="text"
               inputmode="decimal"
               value="1.248,00"
               required>
        <span class="input-group-text">EUR</span>
    </div>
</div>
