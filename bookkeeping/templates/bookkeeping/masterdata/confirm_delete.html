{% extends 'bookkeeping/base.html' %}
{% block title %}Stammdatum löschen{% endblock %}
{% block content %}
<header class="page-header"><h1>Stammdatum löschen</h1></header>
<form method="post" class="card form-card">{% csrf_token %}<p>Soll „{{ object }}“ wirklich gelöscht werden?</p><div class="form-actions"><button class="button button-danger" type="submit">Löschen</button><a href="{% url 'bookkeeping:stammdaten' %}">Abbrechen</a></div></form>
{% endblock %}
